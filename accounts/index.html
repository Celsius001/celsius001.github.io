<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius - Account Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="accounts-header">
            <a href="../home/index.html" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to Home
            </a>
            <div class="brand">Account Settings</div>
            <button id="logoutBtn" class="icon-btn" title="Sign Out">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </header>

        <main class="accounts-content">
            <div class="settings-card">
                <h2>Usage & Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Chat Messages Sent</span>
                        <span id="statMessages" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Time Spent on Games</span>
                        <span id="statGameHours" class="stat-value">0 hours 0 minutes</span>
                    </div>
                </div>
            </div>

            <div class="settings-card">
                <h2>Profile Information</h2>
                <div class="profile-header">
                    <div class="avatar-wrapper" id="avatarWrapper">
                        <img id="profileAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'%3E%3C/path%3E%3Ccircle cx='12' cy='7' r='4'%3E%3C/circle%3E%3C/svg%3E" alt="Avatar">
                        <div class="avatar-overlay">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        </div>
                        <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/gif, image/webp" hidden>
                    </div>
                    <form id="profileForm" class="settings-form">
                        <div class="form-group">
                            <label for="userEmail">Email Address</label>
                            <input type="email" id="userEmail" disabled />
                        </div>
                        <div class="form-group">
                            <label for="usernameInput">Username</label>
                            <input type="text" id="usernameInput" placeholder="Enter new username" required />
                        </div>
                        <button type="submit" class="btn">Update Username</button>
                    </form>
                </div>
            </div>

            <div class="settings-card">
                <h2>Security</h2>
                <form id="passwordForm" class="settings-form">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="At least 6 characters" required />
                    </div>
                    <button type="submit" class="btn">Change Password</button>
                </form>
            </div>

            <div class="settings-card danger-zone">
                <h2>Danger Zone</h2>
                <p class="danger-desc">Permanently delete your account and all associated chat logs and game stats.</p>
                <button id="deleteAccountBtn" class="btn btn-danger">Delete Account</button>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
