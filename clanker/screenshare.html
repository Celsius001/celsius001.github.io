<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clanker AI - Screen Share</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #1a1a1a;
            background-color: #030303;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #888888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            gap: 20px;
            background: radial-gradient(circle at top center, #111111 0%, #000000 60%);
        }

        .video-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-color: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: #666666;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .btn-danger {
            border-color: #441111;
            color: #ff6666;
        }

        .btn-danger:hover {
            background-color: #ff3333;
            color: #ffffff;
            border-color: #ff3333;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            background-color: #1a1a1a;
            color: #ffffff;
            border-color: #333333;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Chat
        </a>
        <div class="title">Assignment Helper - Screen Share</div>
        <div style="width: 100px;"></div>
    </header>

    <main>
        <div class="video-container">
            <video id="screenVideo" autoplay playsinline></video>
            <div id="placeholder" class="placeholder-text">
                Click "Start Sharing" to share your screen or assignment document with Clanker AI.
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                Start Sharing
            </button>
            <button id="captureBtn" class="btn" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Capture Screen
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                Stop Sharing
            </button>
        </div>

        <canvas id="captureCanvas"></canvas>
    </main>

    <script>
        const video = document.getElementById('screenVideo');
        const placeholder = document.getElementById('placeholder');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const stopBtn = document.getElementById('stopBtn');
        const canvas = document.getElementById('captureCanvas');

        let stream = null;

        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false
                });

                video.srcObject = stream;
                placeholder.style.display = 'none';

                startBtn.disabled = true;
                captureBtn.disabled = false;
                stopBtn.disabled = false;

                stream.getVideoTracks()[0].onended = () => {
                    stopSharing();
                };
            } catch (err) {
                console.error("Error accessing screen share:", err);
            }
        });

        stopBtn.addEventListener('click', () => {
            stopSharing();
        });

        function stopSharing() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            placeholder.style.display = 'block';

            startBtn.disabled = false;
            captureBtn.disabled = true;
            stopBtn.disabled = true;
        }

        captureBtn.addEventListener('click', () => {
            if (!stream) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/png');
            sessionStorage.setItem('shared_screenshot', imageData);
            alert("Screen captured! Returning to chat...");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
