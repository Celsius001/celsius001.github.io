<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius - Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="chat-app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-dot"></span>
                <h2>Celsius-001</h2>
            </div>
            <div class="channels-section">
                <span class="section-title">Channels</span>
                <div class="channel-list">
                    <div class="channel-item active" data-channel="general"># general</div>
                    <div class="channel-item" data-channel="music"># music</div>
                    <div class="channel-item" data-channel="gaming"># gaming</div>
                    <div class="channel-item" data-channel="lounge"># lounge</div>
                </div>
            </div>
            <div class="user-profile-bar">
                <img id="current-user-avatar" src="../favicon.ico" alt="Avatar" class="user-avatar">
                <span id="current-username" class="username">Loading...</span>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <div class="channel-info">
                    <span class="hash">#</span>
                    <h3 id="current-channel-title">general</h3>
                </div>
                <div class="header-actions">
                    <button id="homeBtn" class="action-btn" onclick="window.location.href='../index.html'">Home</button>
                </div>
            </header>

            <div class="chat-content-area" id="messages-container">
                <div class="welcome-message">
                    <h2>Welcome to #<span id="welcome-channel-name">general</span>!</h2>
                    <p>This is the start of the channel.</p>
                </div>
                <div id="messages-list"></div>
            </div>

            <div class="chat-input-area" id="input-area">
                <div class="input-wrapper">
                    <input type="text" id="message-input" placeholder="Message #general" autocomplete="off">
                </div>
            </div>
        </main>

        <aside class="right-sidebar">
            <div class="sidebar-header">
                <h3>Online — <span id="online-count">0</span></h3>
            </div>
            <div id="users-list" class="users-list"></div>
        </aside>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
