<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Celsius</title>
    <link rel="icon" href="favicon.ico">
    <style>
        :root {
            --bg-main: #000000;
            --bg-panel: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --accent-color: #ffffff;
            --accent-hover: #d4d4d4;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-container {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 3rem 2.5rem;
            border-radius: 1rem;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .error-message {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .home-btn {
            background: var(--accent-color);
            color: var(--bg-main);
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .home-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
        <a href="home/index.html" class="home-btn" id="homeBtn">Return Home</a>
    </div>

    <script>
        function applyCelsiusSettings() {
            const root = document.documentElement;
            const savedTheme = localStorage.getItem('celsius_theme');
            
            if (savedTheme) {
                try {
                    const theme = JSON.parse(savedTheme);
                    root.style.setProperty('--bg-main', theme.bg);
                    root.style.setProperty('--text-primary', theme.text);
                    root.style.setProperty('--accent-color', theme.accent);
                    root.style.setProperty('--bg-panel', theme.panel);
                    root.style.setProperty('--bg-sidebar', theme.sidebar);
                    document.body.style.backgroundColor = theme.bg;
                    document.body.style.color = theme.text;
                } catch (e) {}
            }
        }

        applyCelsiusSettings();

        window.addEventListener('message', (event) => {
            if (event.data) {
                if (event.data.action === 'updateTheme' || event.data.action === 'updateSettings') {
                    applyCelsiusSettings();
                }
            }
        });
    </script>
</body>
</html>
