<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>celsius | friends</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app-container">
    <aside class="sidebar-left">
        <div class="brand-header" id="nav-chat">
            <h1 class="brand-name">celsius</h1>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </div>
        
        <div class="sidebar-scroll">
            <div class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Friends</span>
            </div>
            
            <div class="category">DIRECT MESSAGES</div>
            <div class="dm-list" id="dm-list">
            </div>
        </div>

        <div class="user-profile-section">
            <div class="user-avatar-wrapper">
                <img src="../favicon.ico" class="avatar-img" id="current-user-avatar" alt="user">
                <div class="status-indicator online"></div>
            </div>
            <div class="user-info">
                <div class="username-display" id="current-username">Connecting...</div>
                <div class="user-status-text">Online</div>
            </div>
        </div>
    </aside>

    <main class="friends-area">
        <div class="friends-header">
            <div class="friends-tabs">
                <div class="tab-item active" data-tab="online">Online</div>
                <div class="tab-item" data-tab="all">All</div>
                <div class="tab-item" data-tab="pending">Pending</div>
                <div class="tab-item add-friend" data-tab="add">Add Friend</div>
            </div>
        </div>
        
        <div class="friends-content">
            <div class="tab-pane active" id="tab-online">
                <div class="section-title">ONLINE — <span id="online-count">0</span></div>
                <div class="users-grid" id="online-users-grid">
                </div>
            </div>
            <div class="tab-pane" id="tab-all"></div>
            <div class="tab-pane" id="tab-pending"></div>
            <div class="tab-pane" id="tab-add"></div>
        </div>
    </main>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
