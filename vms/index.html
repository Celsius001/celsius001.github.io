<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius - Virtual Machine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <script async src="https://ds.mrmnd.com/5479dea0-fdff-420a-a041-9ed17e127546.js"></script>
</head>
<body>
    <div class="vm-app-wrapper">
        <header class="vm-topbar" id="vm-topbar">
            <div class="brand-info">
                <span class="brand-dot"></span>
                <h2>Celsius-001 VM</h2>
            </div>
            <button id="homeBtn" class="action-btn">Home</button>
        </header>

        <main class="vm-main" id="vm-main">
            <div class="vm-card" id="idle-view">
                <div class="vm-card-header">
                    <h3>Cloud Environment</h3>
                    <span id="session-status" class="status-badge offline">Idle</span>
                </div>
                <div class="vm-card-body">
                    <div class="vm-info-box">
                        <p>Launch an isolated full-screen virtual desktop session.</p>
                        <div class="vm-specs">
                            <span>Duration: <strong>25 Minutes</strong></span>
                            <span>Global Limit: <strong id="capacity-count">0</strong> / 2 Active</span>
                        </div>
                    </div>
                    <button id="launchBtn" class="primary-btn">Launch VM</button>
                </div>
            </div>

            <div class="vm-fullscreen-container" id="active-view" style="display: none;">
                <div class="vm-fullscreen-header">
                    <div class="vm-status-indicator">
                        <span class="live-dot"></span>
                        <span>Live Session</span>
                    </div>
                    <div class="timer-display">
                        <span>Time Remaining:</span>
                        <strong id="countdown-timer">25:00</strong>
                    </div>
                    <button id="terminateBtn" class="danger-btn">End Session</button>
                </div>
                <div id="vm-display" class="vm-screen-fullscreen">
                    <div class="spinner"></div>
                    <p>Connecting to remote desktop host...</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
