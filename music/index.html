<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
                <h2>Celsius</h2>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9H6v-9H3l9-8z"/></svg>
                    Home
                </a>
                <a class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    Search
                </a>
            </nav>
            <div class="sidebar-actions">
                <button class="action-btn" id="createPlaylistBtn">
                    <div class="icon-box plus-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </div>
                    Create Playlist
                </button>
                <button class="action-btn" id="likedSongsBtn">
                    <div class="icon-box heart-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                    Liked Songs
                </button>
            </div>
            <div class="sidebar-divider"></div>
            <div class="user-playlists" id="userPlaylists"></div>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <div class="nav-arrows">
                        <button class="arrow-btn">&lt;</button>
                        <button class="arrow-btn">&gt;</button>
                    </div>
                    <div class="search-container">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="searchInput" placeholder="What do you want to listen to?">
                    </div>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="user-avatar" id="headerAvatar"></div>
                        <span id="headerUserName">Log In</span>
                    </div>
                </div>
            </header>
            <div class="content-scrollable" id="mainContentArea"></div>
        </main>
        <footer class="bottom-player">
            <div class="player-left">
                <div class="now-playing-art"></div>
                <div class="now-playing-info">
                    <div class="track-title">Select a track</div>
                    <div class="track-artist">Artist</div>
                </div>
                <button class="favorite-btn" id="favoriteBtn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
            </div>
            <div class="player-center">
                <div class="player-controls">
                    <button class="icon-btn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="icon-btn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" transform="rotate(180 12 12)"/></svg>
                    </button>
                    <button class="icon-btn play-btn" id="playPauseBtn">
                        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="icon-btn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <button class="icon-btn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.18 1.42-1.42zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5z"/></svg>
                    </button>
                </div>
                <div class="player-progress">
                    <span class="time-text">0:00</span>
                    <div class="progress-bar-container" id="progressBarContainer">
                        <div class="progress-bar-fill" id="progressBarFill"></div>
                    </div>
                    <span class="time-text">0:30</span>
                </div>
            </div>
            <div class="player-right">
                <div class="player-volume">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <div id="volumeBarContainer">
                        <div class="progress-bar-fill" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="player-profile-mini">
                    <div class="user-avatar mini" id="playerAvatar"></div>
                </div>
            </div>
        </footer>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
