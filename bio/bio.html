<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="back-btn" id="back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>

    <div class="bio-card" id="bio-card">
        <div class="bio-header">
            <img src="../favicon.ico" id="bio-avatar" alt="Avatar">
            <h1 id="bio-username">Loading...</h1>
        </div>
        <div class="bio-content">
            <h3>About</h3>
            <p id="bio-text">This user has not set a bio yet.</p>
        </div>
        <div class="bio-stats">
            <div class="stat-box">
                <span class="stat-value" id="stat-messages">0</span>
                <span class="stat-label">Messages</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="stat-friends">0</span>
                <span class="stat-label">Friends</span>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
