<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing - Celsius Watch</title>
    <link rel="stylesheet" href="player.css">
</head>
<body>
    <div id="playerBgBlur" class="player-bg-blur"></div>

    <div class="player-container" id="videoContainer">
        <header class="player-header" id="playerHeader">
            <button class="back-btn" id="backBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Back
            </button>
            <h2 class="now-playing-title" id="videoTitle">Loading...</h2>
            <div class="episode-controls" id="episodeControls" style="display: none;">
                <div class="control-group">
                    <label>Season</label>
                    <input type="number" id="seasonInput" value="1" min="1" max="20">
                </div>
                <div class="control-group">
                    <label>Episode</label>
                    <input type="number" id="episodeInput" value="1" min="1" max="100">
                </div>
                <button id="loadEpisodeBtn">Load</button>
            </div>
        </header>

        <main class="video-wrapper">
            <iframe id="mediaFrame" allowfullscreen></iframe>

            <div class="video-overlay-status" id="videoPlaceholder">
                <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                <p id="playerStatus">Locating media stream...</p>
            </div>
        </main>
    </div>

    <script src="player.js"></script>
</body>
</html>
