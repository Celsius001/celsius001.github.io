<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blur"></div>

    <div class="watch-app">
        <header class="watch-nav">
            <div class="nav-left">
                <h1 class="brand-logo">WATCH</h1>
                <div class="content-toggle">
                    <button class="toggle-btn active" data-type="movies">Movies</button>
                    <button class="toggle-btn" data-type="anime">Anime</button>
                </div>
            </div>
            <div class="nav-right">
                <div class="search-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" placeholder="Search titles...">
                </div>
                <div class="user-profile">
                    <div class="avatar"></div>
                    <span id="userGreeting">Guest</span>
                </div>
            </div>
        </header>

        <main class="watch-content">
            <section class="hero" id="heroSection">
                <div class="hero-content">
                    <h2 class="hero-title" id="heroTitle">Loading...</h2>
                    <p class="hero-desc" id="heroDesc">Fetching the latest featured content.</p>
                    <div class="hero-buttons">
                        <button class="play-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Play
                        </button>
                        <button class="info-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                            More Info
                        </button>
                    </div>
                </div>
                <div class="hero-vignette"></div>
            </section>

            <section class="slider-section">
                <h3 class="row-title">Top Hits</h3>
                <div class="movie-row" id="topHitsRow"></div>
            </section>

            <section class="slider-section">
                <h3 class="row-title">Latest Releases</h3>
                <div class="movie-row" id="latestRow"></div>
            </section>

            <section class="slider-section">
                <h3 class="row-title">New Additions</h3>
                <div class="movie-row" id="newRow"></div>
            </section>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
