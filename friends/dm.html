<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Messages</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dm-header {
            background-color: #0a0a0a;
            border-bottom: 1px solid #222222;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background-color: #1a1a1a;
        }

        .dm-title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .dm-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .message-author {
            font-weight: 600;
            font-size: 15px;
        }

        .message-time {
            font-size: 12px;
            color: #888888;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.4;
            color: #dddddd;
        }

        .dm-input-area {
            padding: 24px;
            background-color: #000000;
            border-top: 1px solid #222222;
        }

        .dm-input {
            width: 100%;
            background-color: #111111;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .dm-input:focus {
            border-color: #555555;
        }
    </style>
</head>
<body>
    <div class="dm-header">
        <button class="back-btn" onclick="window.history.back()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <h2 class="dm-title" id="dm-title">Loading chat...</h2>
    </div>

    <div class="dm-messages" id="dm-messages"></div>

    <div class="dm-input-area">
        <input type="text" class="dm-input" id="dm-input" placeholder="Send a message...">
    </div>

    <script type="module" src="dm.js"></script>
</body>
</html>
